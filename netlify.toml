[build]
  publish = "_site"
  command = "npm run build"

# The feed lived at /feed/feed.xml until Apr 2025, when the move to the new
# eleventy-plugin-rss feedPlugin changed it to /feed.xml. Autodiscovery kept
# advertising the old path until Sep 2026, so long-standing subscribers still
# have it. A 301 gets their reader to update to the canonical URL by itself.
[[redirects]]
  from = "/feed/feed.xml"
  to = "/feed.xml"
  status = 301
  force = true

# Carried over from the HTML5 Boilerplate .htaccess, which has never run: the
# site is served by Netlify, not Apache, so nothing in that file took effect.
# Everything else it set — www→apex, HSTS, compression, cache headers — Netlify
# already does. This was the only directive still worth having.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
